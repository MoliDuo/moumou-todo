<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<title>浮窗待办</title>
</head>
<body>
  <div id="stage">
    <div id="widget">
      <div id="header">
        <div id="drag-handle" title="拖动移动位置">
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="4" cy="3" r="1.3" fill="currentColor"></circle><circle cx="10" cy="3" r="1.3" fill="currentColor"></circle><circle cx="4" cy="7" r="1.3" fill="currentColor"></circle><circle cx="10" cy="7" r="1.3" fill="currentColor"></circle><circle cx="4" cy="11" r="1.3" fill="currentColor"></circle><circle cx="10" cy="11" r="1.3" fill="currentColor"></circle></svg>
        </div>
        <textarea id="task-input" rows="1" placeholder="添加任务，回车确认" autocomplete="off"></textarea>
        <button id="collapse-btn" title="折叠 / 展开">
          <svg id="icon-chevron-down" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <svg id="icon-chevron-up" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
      </div>
      <div id="body-section">
        <div id="task-list"></div>
      </div>
      <div id="resize-handle" title="拖动调整窗口大小">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><line x1="21" y1="9" x2="9" y2="21"></line><line x1="21" y1="15" x2="15" y2="21"></line></svg>
      </div>
    </div>
  </div>
  <script src="widget-hit-region.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
