name: Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every push gets its own build; do not cancel or coalesce pending releases.
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Assign release version
        id: version
        run: |
          VERSION=$(node -e '
            const base = require("./package.json").version;
            if (!/^\d+\.\d+\.\d+$/.test(base)) throw new Error("Expected a stable x.y.z base version");
            const [major, minor, patch] = base.split(".").map(Number);
            console.log([major, minor, patch + Number(process.env.GITHUB_RUN_NUMBER)].join("."));
          ')
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build Windows installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --publish never

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          INSTALLER="moumou-todo-$VERSION-setup-x64.exe"
          PORTABLE="moumou-todo-$VERSION-portable-x64.exe"
          cd dist
          test -s "$INSTALLER"
          test -s "$PORTABLE"
          sha256sum "$INSTALLER" "$PORTABLE" > SHA256SUMS.txt

          # A retry can resume a draft, but never overwrite a published release.
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [ "$DRAFT" = false ]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" "$INSTALLER" "$PORTABLE" SHA256SUMS.txt --clobber
          RELEASE_API=$(gh release view "$TAG" --json apiUrl --jq '.apiUrl')
          # Use semantic version ordering if parallel builds finish out of order.
          gh api --method PATCH "$RELEASE_API" -F draft=false -f make_latest=legacy > /dev/null
